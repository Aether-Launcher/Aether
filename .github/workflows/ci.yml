name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Build & Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-14
            platform: darwin/arm64
          - os: ubuntu-22.04
            platform: linux/amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Generate Wails frontend bindings
        # Must run before installing/building the frontend so imports like frontend/wailsjs/... exist.
        # Run from repo root where the Wails project config lives.
        run: |
          echo "Generating Wails frontend bindings..."
          wails generate
          echo "Listing generated files (if any):"
          ls -la frontend/wailsjs || true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build Application
        run: wails build -platform ${{ matrix.platform }}
