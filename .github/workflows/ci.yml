name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-15-intel
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Type-check frontend
        working-directory: frontend
        run: npm run check

      - name: Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          # A flaky Ubuntu mirror or a dpkg lock held by unattended-upgrades
          # must never hang the job. Each attempt is capped with `timeout`
          # and the whole update retries a few times before giving up.
          APT_OPTS="-o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do
            echo "apt-get update (attempt $i)"
            if timeout 300 sudo apt-get $APT_OPTS update; then
              break
            fi
            echo "apt-get update failed (attempt $i); retrying..."
          done
          timeout 600 sudo apt-get $APT_OPTS install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Go Tests
        run: go test ./...

      - name: Verify Build
        run: wails build -clean
