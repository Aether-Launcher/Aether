name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release category
        required: true
        type: choice
        options:
          - major
          - beta
          - hotfix
      version:
        description: Version without the leading v, for example 1.0.0-beta.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    # Validates the version, creates the tag, and pushes it.
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_TYPE" in
            major)
              [[ "$VERSION" =~ ^[0-9]+\.0\.0$ ]] || { echo "Major releases must use X.0.0"; exit 1; }
              ;;
            beta)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "Beta releases must use X.Y.Z-beta.N"; exit 1; }
              ;;
            hotfix)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Hotfix releases must use X.Y.Z"; exit 1; }
              ;;
          esac
          git check-ref-format "refs/tags/v$VERSION"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            platform: linux/amd64
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
          - os: macos-15-intel
            name: macos-amd64
            platform: darwin/amd64
          - os: macos-14
            name: macos-arm64
            platform: darwin/arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.Version=v${{ inputs.version }}" -nsis
          $installer = Get-ChildItem build\bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails NSIS installer was not produced" }
          Move-Item $installer.FullName Aether-${{ matrix.name }}-installer.exe
          Copy-Item build\bin\Aether.exe Aether-${{ matrix.name }}.exe

      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.Version=v${{ inputs.version }}"
          tar -C build/bin -czf Aether-${{ matrix.name }}.tar.gz Aether

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPDIR=build/appimage/Aether.AppDir
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/Aether "$APPDIR/usr/bin/Aether"
          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/aether.png"
          cp build/linux/aether.desktop "$APPDIR/aether.desktop"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run "$APPDIR" Aether-${{ matrix.name }}.AppImage

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.Version=v${{ inputs.version }}"
          hdiutil create -volname Aether -srcfolder build/bin/Aether.app -ov -format UDZO Aether-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            Aether-*.tar.gz
            Aether-*.dmg
            Aether-*.exe
            Aether-*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version, 'alpha') || contains(inputs.version, 'beta') }}
          files: artifacts/**