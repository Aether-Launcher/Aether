name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            platform: linux/amd64
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
          - os: macos-15-intel
            name: macos-amd64
            platform: darwin/amd64
          - os: macos-14
            name: macos-arm64
            platform: darwin/arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -platform ${{ matrix.platform }} -nsis
          $installer = Get-ChildItem build\bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails NSIS installer was not produced" }
          Move-Item $installer.FullName Aether-${{ matrix.name }}-installer.exe
          Copy-Item build\bin\Aether.exe Aether-${{ matrix.name }}.exe

      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          wails build -clean -platform ${{ matrix.platform }}
          tar -C build/bin -czf Aether-${{ matrix.name }}.tar.gz Aether

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          wails build -clean -platform ${{ matrix.platform }}
          hdiutil create -volname Aether -srcfolder build/bin/Aether.app -ov -format UDZO Aether-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            Aether-*.tar.gz
            Aether-*.dmg
            Aether-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: artifacts/**
