name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release category
        required: true
        type: choice
        options:
          - major
          - beta
          - hotfix
      version:
        description: Version without the leading v, for example 1.0.0-beta.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    # Validates the version, creates the tag, and pushes it.
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_TYPE" in
            major)
              [[ "$VERSION" =~ ^[0-9]+\.0\.0$ ]] || { echo "Major releases must use X.0.0"; exit 1; }
              ;;
            beta)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "Beta releases must use X.Y.Z-beta.N"; exit 1; }
              ;;
            hotfix)
              [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Hotfix releases must use X.Y.Z"; exit 1; }
              ;;
          esac
          git check-ref-format "refs/tags/v$VERSION"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            platform: linux/amd64
          - os: windows-latest
            name: windows-amd64
            platform: windows/amd64
          - os: macos-15-intel
            name: macos-amd64
            platform: darwin/amd64
          - os: macos-14
            name: macos-arm64
            platform: darwin/arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Linux dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          # A flaky Ubuntu mirror or a dpkg lock held by unattended-upgrades
          # must never hang the job. Each attempt is capped with `timeout`
          # and the whole update retries a few times before giving up.
          APT_OPTS="-o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          for i in 1 2 3; do
            echo "apt-get update (attempt $i)"
            if timeout 300 sudo apt-get $APT_OPTS update; then
              break
            fi
            echo "apt-get update failed (attempt $i); retrying..."
          done
          timeout 600 sudo apt-get $APT_OPTS install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.Version=v${{ inputs.version }}" -nsis
          $installer = Get-ChildItem build\bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails NSIS installer was not produced" }
          Move-Item $installer.FullName Aether-${{ matrix.name }}-installer.exe
          Copy-Item build\bin\Aether.exe Aether-${{ matrix.name }}.exe

      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.Version=v${{ inputs.version }}"
          tar -C build/bin -czf Aether-${{ matrix.name }}.tar.gz Aether

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPDIR=build/appimage/Aether.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/icons/hicolor/256x256/apps" "$APPDIR/usr/share/applications"
          cp build/bin/Aether "$APPDIR/usr/bin/Aether"
          cp build/appicon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/aether.png"
          cp build/appicon.png "$APPDIR/aether.png"
          ln -sf aether.png "$APPDIR/.DirIcon"
          cp build/linux/aether.desktop "$APPDIR/aether.desktop"
          cp build/linux/aether.desktop "$APPDIR/usr/share/applications/aether.desktop"
          # Explicit AppRun so `squashfs-root/AppRun` always exists after --appimage-extract
          # and we can handle distro webkit path differences (Debian vs Arch).
          cat > "$APPDIR/AppRun" <<'APPRUN_EOF'
          #!/bin/bash
          SELF="$(readlink -f "$0")"
          HERE="$(dirname "$SELF")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Arch Linux has webkit at /usr/lib/webkit2gtk-4.0, Debian/Ubuntu at
          # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0. The Ubuntu-built binary's
          # libwebkit expects the Debian path; on Arch we create a compat view
          # via a tmp overlay if possible, otherwise print a helpful hint.
          if [ ! -e /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0/WebKitNetworkProcess ] && [ -e /usr/lib/webkit2gtk-4.0/WebKitNetworkProcess ]; then
            echo "[Aether] Detected Arch webkit layout; Debian path missing." >&2
            echo "[Aether] Try: sudo mkdir -p /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0 && sudo ln -sf /usr/lib/webkit2gtk-4.0/WebKitNetworkProcess /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0/WebKitNetworkProcess" >&2
            echo "[Aether]      sudo ln -sf /usr/lib/webkit2gtk-4.0/WebKitWebProcess /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0/WebKitWebProcess" >&2
            # Also handle 4.1 variant if present
            if [ -e /usr/lib/webkit2gtk-4.1/WebKitNetworkProcess ] && [ ! -e /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/WebKitNetworkProcess ]; then
              echo "[Aether] Also found webkit 4.1 at Arch path." >&2
            fi
          fi
          if [ ! -e /usr/lib/x86_64-linux-gnu/webkit2gtk-4.0/WebKitNetworkProcess ] && [ ! -e /usr/lib/webkit2gtk-4.0/WebKitNetworkProcess ] && [ ! -e /usr/lib/webkit2gtk-4.1/WebKitNetworkProcess ]; then
            echo "[Aether] ERROR: No WebKit found. Install:" >&2
            echo "[Aether]   Ubuntu/Debian 22.04: sudo apt install libwebkit2gtk-4.0-37 libgtk-3-0 libayatana-appindicator3-1" >&2
            echo "[Aether]   Ubuntu 24.04+  : sudo apt install libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1" >&2
            echo "[Aether]   Arch Linux   : sudo pacman -S webkit2gtk gtk3 libappindicator-gtk3" >&2
            echo "[Aether]   Fedora       : sudo dnf install webkit2gtk4.0 gtk3 libappindicator-gtk3" >&2
          fi
          exec "$HERE/usr/bin/Aether" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"
          APPIMAGE_OUT="Aether-${{ matrix.name }}.AppImage"
          echo "[AppImage] Building with appimagetool (no bundled webkit; uses host libwebkit)"
          wget -q --timeout=60 https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool 2>/dev/null || wget -q --timeout=60 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          timeout 600 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "$APPIMAGE_OUT"
          ls -lh "$APPIMAGE_OUT"
          echo "[AppImage] Built: $APPIMAGE_OUT"
          echo "[AppImage] Host still requires libwebkit2gtk. See README for per-distro install."

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.Version=v${{ inputs.version }}"
          hdiutil create -volname Aether -srcfolder build/bin/Aether.app -ov -format UDZO Aether-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            Aether-*.tar.gz
            Aether-*.dmg
            Aether-*.exe
            Aether-*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version, 'alpha') || contains(inputs.version, 'beta') }}
          files: artifacts/**