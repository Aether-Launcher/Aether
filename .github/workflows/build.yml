name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: Aether-linux-amd64

          - os: windows-latest
            platform: windows/amd64
            artifact: Aether-windows-amd64-installer.exe

          - os: macos-14
            platform: darwin/arm64
            artifact: Aether-macos-arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install pkg-config create-dmg

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Windows
        if: runner.os == 'Windows'
        run: wails build -clean --platform windows/amd64 --nsis

      - name: Build macOS/Linux
        if: runner.os != 'Windows'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          create-dmg \
            "${{ matrix.artifact }}" \
            build/bin/Aether.app

      - name: Rename Linux binary
        if: runner.os == 'Linux'
        run: mv build/bin/Aether ${{ matrix.artifact }}

      - name: Rename Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item `
            "build/bin/Aether-amd64-installer.exe" `
            "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Aether ${{ github.ref_name }}
          files: artifacts/**