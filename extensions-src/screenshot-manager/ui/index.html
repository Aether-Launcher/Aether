<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshot Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header">
    <div class="title-row">
      <h2>Screenshot Manager</h2>
      <button id="refreshBtn" class="icon-btn" title="Refresh screenshots"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg></button>
    </div>
    <div class="controls-row">
      <div class="instance-select-wrap">
        <label>Instance:</label>
        <select id="instanceSelect">
          <option value="">Loading instances...</option>
        </select>
      </div>
      <div class="count-badge" id="countBadge">0 screenshots</div>
    </div>
  </div>

  <div id="galleryContainer" class="gallery-container">
    <div class="placeholder-wrap">
      <div class="placeholder-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
      <p>Select an instance to view its screenshots</p>
    </div>
  </div>

  <!-- Lightbox Fullscreen Modal -->
  <div id="lightboxModal" class="lightbox-backdrop hidden">
    <div class="lightbox-content">
      <div class="lightbox-header">
        <span id="lightboxTitle" class="lightbox-title">screenshot.png</span>
        <div class="lightbox-actions">
          <button id="openExternalBtn" class="lightbox-btn" title="Open in system viewer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Open</button>
          <button id="copyBtn" class="lightbox-btn" title="Copy to clipboard"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> Copy</button>
          <button id="deleteBtn" class="lightbox-btn btn-danger" title="Delete screenshot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg> Delete</button>
          <button id="closeLightboxBtn" class="lightbox-close" title="Close">✕</button>
        </div>
      </div>
      <div class="lightbox-image-wrap">
        <button id="prevImgBtn" class="nav-btn prev-btn" title="Previous screenshot">‹</button>
        <img id="lightboxImg" src="" alt="Screenshot preview" />
        <button id="nextImgBtn" class="nav-btn next-btn" title="Next screenshot">›</button>
      </div>
      <div class="lightbox-footer">
        <span id="lightboxMeta">0 KB · 2026-09-01</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
