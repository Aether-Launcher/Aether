<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CurseForge Browser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="header">
    <div class="tabs">
      <button class="tab active" id="tabMods" data-classid="6">Mods</button>
      <button class="tab" id="tabModpacks" data-classid="4471">Modpacks</button>
      <button class="tab" id="tabResourcePacks" data-classid="12">Resource Packs</button>
      <button class="tab" id="tabShaders" data-classid="6552">Shaders</button>
    </div>
    <div class="search-row">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search CurseForge…" autocomplete="off" />
      </div>
    </div>
  </div>

  <div id="resultsContainer">
    <div class="placeholder-wrap">
      <div class="placeholder-icon">🔍</div>
      <p>Search CurseForge above</p>
    </div>
  </div>

  <div id="paginationBar" class="pagination-bar hidden">
    <button id="prevPageBtn" class="page-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Prev
    </button>
    <span id="pageIndicator" class="page-indicator">Page 1</span>
    <button id="nextPageBtn" class="page-btn" disabled>
      Next
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <!-- Mod / Resource Pack / Shader Install Modal -->
  <div id="installModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <div id="modalModIcon" class="modal-mod-icon"></div>
        <div>
          <h3 id="modalModName">Mod Name</h3>
          <p id="modalModAuthor" class="modal-mod-author"></p>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>

      <div class="modal-section">
        <label class="modal-label">Version</label>
        <div class="custom-select" id="versionSelect">
          <div class="custom-select-trigger">
            <span class="custom-select-text">Loading versions...</span>
            <svg class="custom-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="custom-select-options hidden"></div>
        </div>
      </div>

      <div class="modal-section">
        <label class="modal-label">Target Instance</label>
        <div class="custom-select" id="instanceSelect">
          <div class="custom-select-trigger">
            <span class="custom-select-text">Loading instances...</span>
            <svg class="custom-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="custom-select-options hidden"></div>
        </div>
      </div>

      <div id="installStatus" class="install-status hidden"></div>

      <div class="modal-actions">
        <button class="btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn-install" id="installBtn">
          <span id="installBtnText">Install</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modpack Install Modal -->
  <div id="packModal" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <div id="packModalIcon" class="modal-mod-icon"></div>
        <div>
          <h3 id="packModalName">Modpack Name</h3>
          <p id="packModalAuthor" class="modal-mod-author"></p>
        </div>
        <button class="modal-close" id="packModalClose">✕</button>
      </div>

      <div class="modal-section">
        <label class="modal-label">Version</label>
        <div class="custom-select" id="packVersionSelect">
          <div class="custom-select-trigger">
            <span class="custom-select-text">Loading versions...</span>
            <svg class="custom-select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
          <div class="custom-select-options hidden"></div>
        </div>
      </div>

      <div class="modal-section">
        <label class="modal-label">Instance Name</label>
        <input
          type="text"
          id="packNameInput"
          class="search-bar"
          style="width:100%; box-sizing:border-box; padding:10px;"
          placeholder="Leave blank to use pack name"
        />
      </div>

      <div id="packInstallStatus" class="install-status hidden"></div>

      <div class="modal-actions">
        <button class="btn-cancel" id="packCancelBtn">Cancel</button>
        <button class="btn-install" id="packInstallBtn">
          <span id="packInstallBtnText">Create &amp; Install</span>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
